<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tessellated Torus Illusion</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; cursor: crosshair; }
    canvas { display: block; }
    #info {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.3);
      font-family: 'Courier New', monospace;
      font-size: 12px;
      letter-spacing: 2px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="info">TESSELLATED TORUS — CLICK TO CHANGE MODE</div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    // Scene setup
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 7;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 1);
    document.body.appendChild(renderer.domElement);

    // Post-processing bloom
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.3, 0.4, 0.85
    );
    composer.addPass(bloom);

    // Starfield
    const starCount = 2000;
    const starGeo = new THREE.BufferGeometry();
    const starPositions = new Float32Array(starCount * 3);
    const starSizes = new Float32Array(starCount);
    for (let i = 0; i < starCount; i++) {
      starPositions[i * 3] = (Math.random() - 0.5) * 80;
      starPositions[i * 3 + 1] = (Math.random() - 0.5) * 80;
      starPositions[i * 3 + 2] = (Math.random() - 0.5) * 80;
      starSizes[i] = Math.random() * 2 + 0.5;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    starGeo.setAttribute('size', new THREE.BufferAttribute(starSizes, 1));

    const starMat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
      },
      vertexShader: `
        attribute float size;
        uniform float uTime;
        varying float vAlpha;
        void main() {
          vAlpha = 0.3 + 0.7 * abs(sin(uTime * 0.5 + position.x * 10.0));
          vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
          gl_PointSize = size * (200.0 / -mvPosition.z);
          gl_Position = projectionMatrix * mvPosition;
        }
      `,
      fragmentShader: `
        varying float vAlpha;
        void main() {
          float d = length(gl_PointCoord - 0.5);
          if (d > 0.5) discard;
          float alpha = smoothstep(0.5, 0.0, d) * vAlpha;
          gl_FragColor = vec4(0.85, 0.88, 0.95, alpha);
        }
      `,
      transparent: true,
      depthWrite: false,
    });
    const stars = new THREE.Points(starGeo, starMat);
    scene.add(stars);

    // Tessellated torus panels
    const torusGroup = new THREE.Group();
    scene.add(torusGroup);

    const R = 2.2;  // Major radius
    const r = 0.9;  // Minor radius
    const segmentsU = 24; // Around the tube
    const segmentsV = 48; // Around the ring
    const gap = 0.03;

    function createTorusPanels() {
      for (let i = 0; i < segmentsV; i++) {
        for (let j = 0; j < segmentsU; j++) {
          const u0 = (i / segmentsV) * Math.PI * 2;
          const u1 = ((i + 1) / segmentsV) * Math.PI * 2;
          const v0 = (j / segmentsU) * Math.PI * 2;
          const v1 = ((j + 1) / segmentsU) * Math.PI * 2;

          // Shrink each panel slightly for gap effect
          const uMid = (u0 + u1) / 2;
          const vMid = (v0 + v1) / 2;
          const shrink = 1 - gap;
          const ua = uMid + (u0 - uMid) * shrink;
          const ub = uMid + (u1 - uMid) * shrink;
          const va = vMid + (v0 - vMid) * shrink;
          const vb = vMid + (v1 - vMid) * shrink;

          const vertices = [];
          const normals = [];
          const subDiv = 3;

          for (let su = 0; su <= subDiv; su++) {
            for (let sv = 0; sv <= subDiv; sv++) {
              const u = ua + (ub - ua) * (su / subDiv);
              const v = va + (vb - va) * (sv / subDiv);
              const x = (R + r * Math.cos(v)) * Math.cos(u);
              const y = (R + r * Math.cos(v)) * Math.sin(u);
              const z = r * Math.sin(v);
              vertices.push(x, y, z);

              const nx = Math.cos(v) * Math.cos(u);
              const ny = Math.cos(v) * Math.sin(u);
              const nz = Math.sin(v);
              normals.push(nx, ny, nz);
            }
          }

          const indices = [];
          for (let su = 0; su < subDiv; su++) {
            for (let sv = 0; sv < subDiv; sv++) {
              const a = su * (subDiv + 1) + sv;
              const b = a + 1;
              const c = a + (subDiv + 1);
              const d = c + 1;
              indices.push(a, b, c, b, d, c);
            }
          }

          const geometry = new THREE.BufferGeometry();
          geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
          geometry.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
          geometry.setIndex(indices);

          // Wireframe edges
          const edgesGeo = new THREE.EdgesGeometry(geometry, 15);
          const edgesMat = new THREE.LineBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.6,
          });
          const edges = new THREE.LineSegments(edgesGeo, edgesMat);

          // Subtle face material
          const faceMat = new THREE.MeshBasicMaterial({
            color: 0x111118,
            transparent: true,
            opacity: 0.4,
            side: THREE.DoubleSide,
          });
          const face = new THREE.Mesh(geometry, faceMat);

          const panelGroup = new THREE.Group();
          panelGroup.add(face);
          panelGroup.add(edges);
          panelGroup.userData = { i, j, u: uMid, v: vMid };
          torusGroup.add(panelGroup);
        }
      }
    }

    createTorusPanels();

    // Rotation tilt
    torusGroup.rotation.x = Math.PI * 0.35;
    torusGroup.rotation.z = Math.PI * 0.1;

    // Animation modes
    let mode = 0;
    const modes = 3;
    document.addEventListener('click', () => {
      mode = (mode + 1) % modes;
    });

    // Mouse interaction
    const mouse = { x: 0, y: 0 };
    document.addEventListener('mousemove', (e) => {
      mouse.x = (e.clientX / window.innerWidth - 0.5) * 2;
      mouse.y = (e.clientY / window.innerHeight - 0.5) * 2;
    });

    // Animation loop
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      starMat.uniforms.uTime.value = t;
      stars.rotation.y = t * 0.01;

      // Rotate torus
      torusGroup.rotation.y = t * 0.3;

      // Mouse influence
      torusGroup.rotation.x = Math.PI * 0.35 + mouse.y * 0.15;
      torusGroup.rotation.z = Math.PI * 0.1 + mouse.x * 0.1;

      // Animate individual panels
      torusGroup.children.forEach((panel) => {
        if (!panel.userData.i && panel.userData.i !== 0) return;
        const { i, j, u, v } = panel.userData;

        const edges = panel.children[1];
        const face = panel.children[0];

        if (mode === 0) {
          // Wave displacement along normals
          const wave = Math.sin(u * 3 + t * 2) * Math.cos(v * 2 + t * 1.5) * 0.08;
          const nx = Math.cos(v) * Math.cos(u);
          const ny = Math.cos(v) * Math.sin(u);
          const nz = Math.sin(v);
          panel.position.set(nx * wave, ny * wave, nz * wave);

          const brightness = 0.4 + 0.3 * Math.sin(u * 4 + t * 2);
          edges.material.opacity = brightness;
          face.material.opacity = 0.15 + 0.15 * Math.sin(v * 3 - t);
        } else if (mode === 1) {
          // Spiral peel effect
          const delay = (i / segmentsV + j / segmentsU) * 2;
          const phase = Math.sin(t * 1.5 - delay);
          const lift = Math.max(0, phase) * 0.3;
          const nx = Math.cos(v) * Math.cos(u);
          const ny = Math.cos(v) * Math.sin(u);
          const nz = Math.sin(v);
          panel.position.set(nx * lift, ny * lift, nz * lift);

          edges.material.opacity = 0.3 + lift * 2;
          face.material.opacity = 0.1 + lift * 0.8;
        } else if (mode === 2) {
          // Breathing / pulsing
          const pulse = Math.sin(t * 2) * 0.05;
          const scatter = Math.sin(u * 5 + v * 3 + t * 3) * 0.04;
          const total = pulse + scatter;
          const nx = Math.cos(v) * Math.cos(u);
          const ny = Math.cos(v) * Math.sin(u);
          const nz = Math.sin(v);
          panel.position.set(nx * total, ny * total, nz * total);

          const flicker = 0.3 + 0.4 * Math.abs(Math.sin(i * 0.7 + j * 1.3 + t * 4));
          edges.material.opacity = flicker;
          face.material.opacity = 0.05 + 0.2 * Math.abs(Math.cos(i + j + t * 2));
        }
      });

      composer.render();
    }

    animate();

    // Resize handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
