<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Penrose Torus — Impossible Object</title>
  <style>
    * { margin: 0; padding: 0; }
    body { background: #000; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Pure Canvas 2D — Penrose-style impossible torus
// This creates the specific "brain-breaking" illusion from the tweet

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Starfield
const NUM_STARS = 1500;
const starsData = [];
for (let i = 0; i < NUM_STARS; i++) {
  starsData.push({
    x: Math.random(),
    y: Math.random(),
    size: Math.random() * 1.5 + 0.3,
    alpha: Math.random() * 0.7 + 0.3,
    twinkleSpeed: Math.random() * 2 + 0.5,
  });
}

function drawStars(t) {
  for (const s of starsData) {
    const alpha = s.alpha * (0.5 + 0.5 * Math.sin(t * s.twinkleSpeed + s.x * 100));
    ctx.fillStyle = `rgba(200, 210, 230, ${alpha})`;
    ctx.beginPath();
    ctx.arc(s.x * canvas.width, s.y * canvas.height, s.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

// Torus parameterization
const R = 1.0;   // Major radius
const r_tube = 0.42;  // Minor radius

function torusPoint(u, v) {
  const x = (R + r_tube * Math.cos(v)) * Math.cos(u);
  const y = (R + r_tube * Math.cos(v)) * Math.sin(u);
  const z = r_tube * Math.sin(v);
  return { x, y, z };
}

function project(point, rotX, rotY, rotZ, scale, cx, cy) {
  let { x, y, z } = point;

  // Rotate Y
  let x1 = x * Math.cos(rotY) - z * Math.sin(rotY);
  let z1 = x * Math.sin(rotY) + z * Math.cos(rotY);
  x = x1; z = z1;

  // Rotate X
  let y1 = y * Math.cos(rotX) - z * Math.sin(rotX);
  let z2 = y * Math.sin(rotX) + z * Math.cos(rotX);
  y = y1; z = z2;

  // Rotate Z
  let x2 = x * Math.cos(rotZ) - y * Math.sin(rotZ);
  let y2 = x * Math.sin(rotZ) + y * Math.cos(rotZ);
  x = x2; y = y2;

  // Perspective
  const fov = 3.5;
  const perspective = fov / (fov + z);
  return {
    x: cx + x * scale * perspective,
    y: cy + y * scale * perspective,
    z: z,
    p: perspective
  };
}

// Generate torus segments as quads
const segU = 36;
const segV = 18;

function getQuads(rotX, rotY, rotZ, scale, cx, cy, t) {
  const quads = [];

  for (let i = 0; i < segU; i++) {
    for (let j = 0; j < segV; j++) {
      const u0 = (i / segU) * Math.PI * 2;
      const u1 = ((i + 1) / segU) * Math.PI * 2;
      const v0 = (j / segV) * Math.PI * 2;
      const v1 = ((j + 1) / segV) * Math.PI * 2;

      // Gap/shrink
      const uMid = (u0 + u1) / 2;
      const vMid = (v0 + v1) / 2;
      const sh = 0.88;
      const ua = uMid + (u0 - uMid) * sh;
      const ub = uMid + (u1 - uMid) * sh;
      const va = vMid + (v0 - vMid) * sh;
      const vb = vMid + (v1 - vMid) * sh;

      // Animated displacement
      const wave = Math.sin(uMid * 3 + t * 2) * Math.cos(vMid * 2 + t * 1.3) * 0.04;

      const corners = [
        [ua, va], [ub, va], [ub, vb], [ua, vb]
      ].map(([u, v]) => {
        const p = torusPoint(u, v);
        // Displace along normal
        const nx = Math.cos(v) * Math.cos(u);
        const ny = Math.cos(v) * Math.sin(u);
        const nz = Math.sin(v);
        return {
          x: p.x + nx * wave,
          y: p.y + ny * wave,
          z: p.z + nz * wave
        };
      });

      const projected = corners.map(c => project(c, rotX, rotY, rotZ, scale, cx, cy));

      // Average Z for sorting
      const avgZ = projected.reduce((s, p) => s + p.z, 0) / 4;

      // Normal for lighting
      const p0 = corners[0], p1 = corners[1], p2 = corners[3];
      const ax = p1.x - p0.x, ay = p1.y - p0.y, az = p1.z - p0.z;
      const bx = p2.x - p0.x, by = p2.y - p0.y, bz = p2.z - p0.z;
      let nx = ay * bz - az * by;
      let ny = az * bx - ax * bz;
      let nz = ax * by - ay * bx;
      const len = Math.sqrt(nx*nx + ny*ny + nz*nz) || 1;
      nx /= len; ny /= len; nz /= len;

      // Light from camera direction
      const light = Math.abs(nx * 0.2 + ny * 0.3 + nz * 0.9);

      quads.push({ projected, avgZ, light, i, j, uMid, vMid });
    }
  }

  // Sort by Z (painter's algorithm)
  quads.sort((a, b) => a.avgZ - b.avgZ);
  return quads;
}

function drawFrame(t) {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  drawStars(t);

  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const scale = Math.min(canvas.width, canvas.height) * 0.28;

  const rotX = Math.PI * 0.4;
  const rotY = t * 0.4;
  const rotZ = Math.PI * 0.08;

  const quads = getQuads(rotX, rotY, rotZ, scale, cx, cy, t);

  for (const quad of quads) {
    const { projected, light, i, j, uMid, vMid } = quad;

    // Face
    const brightness = Math.floor(light * 30 + 5);
    const edgeBrightness = Math.floor(light * 180 + 60);

    // Subtle color shift
    const hue = ((uMid / (Math.PI * 2)) * 30 + 220) % 360;

    ctx.beginPath();
    ctx.moveTo(projected[0].x, projected[0].y);
    for (let k = 1; k < 4; k++) {
      ctx.lineTo(projected[k].x, projected[k].y);
    }
    ctx.closePath();

    // Fill with very dark face
    ctx.fillStyle = `hsla(${hue}, 15%, ${brightness}%, 0.7)`;
    ctx.fill();

    // Draw edges (wireframe)
    ctx.strokeStyle = `rgba(${edgeBrightness}, ${edgeBrightness + 10}, ${edgeBrightness + 20}, ${0.4 + light * 0.5})`;
    ctx.lineWidth = 0.8 + light * 0.8;
    ctx.stroke();
  }

  // Vignette
  const gradient = ctx.createRadialGradient(cx, cy, scale * 0.5, cx, cy, scale * 3);
  gradient.addColorStop(0, 'rgba(0,0,0,0)');
  gradient.addColorStop(1, 'rgba(0,0,0,0.6)');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

let startTime = null;
function loop(timestamp) {
  if (!startTime) startTime = timestamp;
  const t = (timestamp - startTime) / 1000;
  drawFrame(t);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
