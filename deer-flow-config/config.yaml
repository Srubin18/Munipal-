# DeerFlow Configuration for Munipal
# Autonomous research agent for municipal bill verification

# Model configuration - uses your existing OpenAI key
models:
  default:
    provider: openai
    model: gpt-4o
    temperature: 0.1  # Low temp for accurate tariff analysis

  research:
    provider: openai
    model: gpt-4o
    temperature: 0.3

  coding:
    provider: openai
    model: gpt-4o
    temperature: 0.0  # Zero temp for code generation

# Skills - what DeerFlow can do for Munipal
skills:
  - name: tariff-researcher
    description: |
      Research and extract official municipal tariff rates from
      City of Johannesburg publications and government websites.
      Compare rates across financial years (July-June cycle).
    tools:
      - web_search
      - web_fetch
      - file_read

  - name: bill-analyzer
    description: |
      Analyze municipal bill PDFs to extract charges, meter readings,
      and property details. Cross-reference against known tariff rates.
    tools:
      - file_read
      - code_execute

  - name: dispute-drafter
    description: |
      Draft formal dispute letters for incorrect municipal charges.
      Reference specific tariff rules, MPRA sections, and CoJ bylaws.
      Include citations to official source documents.
    tools:
      - web_search
      - file_read
      - file_write

  - name: regulation-monitor
    description: |
      Monitor for new tariff publications, council resolutions,
      and regulatory changes from CoJ, NERSA, and national government.
    tools:
      - web_search
      - web_fetch

# Memory - persistent knowledge across sessions
memory:
  enabled: true
  store: local
  categories:
    - tariff_rates      # Known verified tariff rates
    - bill_patterns     # Common billing errors found
    - legal_references  # MPRA sections, bylaws cited
    - user_properties   # Property details and history

# Sandbox configuration
sandbox:
  enabled: true
  timeout: 300  # 5 min max per code execution
  allowed_packages:
    - pandas
    - openpyxl
    - pdfplumber
    - tabula-py
    - requests
    - beautifulsoup4

# API Gateway
gateway:
  port: 8024
  cors_origins:
    - http://localhost:3000  # Munipal Next.js dev server
    - https://www.munipal.tech  # Production
